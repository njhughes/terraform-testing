on:
    workflow_dispatch:
    push:

permissions:
 id-token: write
 contents: write

jobs:
    terraform-deploy:
        runs-on: ubuntu-latest

        steps:
        -    name: Configure AWS Credentials
             uses: aws-actions/configure-aws-credentials@v6.3.0
             with:
                role-to-assume: arn:aws:iam::776074619434:role/github-actions-terraform
                aws-region: eu-west-2

        - name: Checkout Code
          uses: actions/checkout@v4

      # 2. Install the preferred version of Terraform CLI
        - name: Setup Terraform
          uses: hashicorp/setup-terraform@v4

      # 3. Initialize Terraform
        - name: Terraform Init
          run: terraform init -input=false

        - name: Terraform Plan
          id: plan
          run: terraform plan -no-color -input=false
          continue-on-error: true

                # 4. Run Terraform Apply with auto-approval
        - name: Terraform Apply
          run: terraform apply -input=false -auto-approve      
        - name: Git commitstate file
          uses: stefanzweifel/git-auto-commit-action@v7
          with:
            commit_message: update terraform state file
            file_pattern: terraform.tfstate



