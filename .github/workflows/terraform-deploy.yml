on:
    workflow_dispatch:
    push:

permissions:
 id-token: write

jobs:
    terraform-deploy:
        runs-on: ubuntu-latest

        steps:
        -    name: Configure AWS Credentials
             uses: aws-actions/configure-aws-credentials@v6.3.0
             with:
                role-to-assume: arn:aws:iam::776074619434:role/github-actions-terraform
                aws-region: eu-west-2
        -    name: Run TF init command
             run: terraform init
        -    name: Run TF paln command
             run: terraform plan